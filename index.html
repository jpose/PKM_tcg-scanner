<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Scanner PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --price-color: #10b981;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      margin: 0;
      padding: 16px 12px 32px;
      background-color: var(--bg-color);
      color: var(--text-main);
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-wrapper { flex: 1; }

    .tabs {
      display: flex;
      gap: 6px;
      max-width: 420px;
      margin: 0 auto 16px;
      background: #1e293b;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .logo-container {
      max-width: 420px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: center;
    }

    .app-logo {
      width: 160px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .views { max-width: 420px; margin: 0 auto; }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.instructions { font-size: 0.85rem; color: var(--text-muted); margin-top: 0; margin-bottom: 16px; }

    .camera-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    video { width: 100%; display: block; border-radius: 14px; }

    button.action-btn {
      margin-top: 14px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      transition: transform 0.1s ease;
    }

    button.action-btn:active { transform: scale(0.98); }
    button.secondary { background: #334155; box-shadow: none; }
    button.btn-reverse { background: linear-gradient(135deg, #a855f7, #7e22ce); box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3); }
    button.btn-holo { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status { margin-top: 12px; font-size: 0.9rem; color: #cbd5e1; font-weight: 500; }
    #debug-ai { font-size: 0.8rem; color: #818cf8; margin-top: 4px; font-family: monospace; word-break: break-all; }

    #selection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px auto; }

    .card-choice {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
    }

    .card-choice:hover { border-color: var(--primary); }
    .card-choice img { width: 100%; border-radius: 8px; }
    .card-choice p { margin: 6px 0 0; font-size: 0.75rem; font-weight: 600; color: var(--text-main); }

    .card-result {
      margin-top: 16px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .card-result img { max-width: 170px; border-radius: 10px; box-shadow: 0 6px 12px rgba(0,0,0,0.4); }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .badge-owned { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-new { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }

    .price-list {
      margin: 10px 0;
      padding: 8px 12px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.8rem;
      text-align: left;
    }
    .price-item { display: flex; justify-content: space-between; padding: 3px 0; }
    .price-item span.val { font-weight: bold; color: var(--price-color); }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn-group button { margin-top: 0; font-size: 0.8rem; padding: 10px 4px; }

    .collection-stats {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      color: #a5b4fc;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .collection-stats span.total-val { color: var(--price-color); font-size: 1.05rem; }

    .backup-actions { display: flex; gap: 8px; margin-bottom: 16px; }
    .backup-actions button { margin-top: 0; font-size: 0.8rem; padding: 10px; }

    .collection-grid-view { display: flex; flex-direction: column; gap: 12px; }

    .collection-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      text-align: left;
      border: 1px solid var(--border-color);
    }

    .collection-item img {
      width: 70px;
      height: 98px;
      object-fit: contain;
      border-radius: 6px;
      background: #0f172a;
      flex-shrink: 0;
    }

    .collection-info { flex: 1; min-width: 0; }
    .collection-info h4 { margin: 0 0 2px 0; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .collection-info p.id-txt { margin: 0 0 6px 0; font-size: 0.75rem; color: var(--text-muted); }

    .qty-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 0.78rem; color: #cbd5e1; }
    .qty-controls { display: flex; gap: 4px; align-items: center; }
    
    .qty-btn {
      width: 22px; height: 22px; padding: 0; border: 1px solid var(--border-color);
      background: #334155; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .qty-btn:active { background: var(--primary); }

    .delete-btn { background: transparent; color: #f87171; border: none; padding: 4px; font-size: 0.8rem; cursor: pointer; opacity: 0.8; margin-left: auto; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; }

    footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="tabs">
      <button class="tab-btn active" id="tab-scan-btn" onclick="switchTab('scan')">Scanner</button>
      <button class="tab-btn" id="tab-collection-btn" onclick="switchTab('collection')">Ma Collection</button>
    </div>

    <div class="logo-container">
      <img src="logo.jpg" alt="TCG Manager Logo" class="app-logo">
    </div>

    <div class="views">
      <div id="view-scan">
        <h1>Scanner AI TCG</h1>
        <p class="instructions">Placer la carte au centre du cadre</p>

        <div class="camera-box" id="camera-container">
          <video id="video" autoplay playsinline></video>
        </div>

        <button id="snap-btn" class="action-btn">Analyser la carte</button>
        <button id="reset-btn" class="action-btn secondary" style="display: none;" onclick="resetScan()">Scanner une autre carte</button>
        
        <div id="status">Prêt !</div>
        <div id="debug-ai"></div>

        <div id="selection-grid" style="display: none;"></div>
        <div id="result" class="card-result" style="display: none;"></div>
      </div>

      <div id="view-collection" style="display: none;">
        <h1>Ma Collection</h1>

        <div class="backup-actions">
          <button class="action-btn secondary" onclick="exportCollection()">Exporter (JSON)</button>
          <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">Importer</button>
          <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importCollection(event)">
        </div>

        <div class="collection-stats" id="collection-stats">
          <div>Cartes : 0 | Exemplaires : 0</div>
          <div>Valeur estimée : <span class="total-val">0.00 €</span></div>
        </div>

        <div id="collection-list" class="collection-grid-view"></div>
      </div>
    </div>
  </div>

  <footer>
    <div>Propulsé par TCGdex API & DexieDB</div>
    <div id="footer-timestamp"></div>
  </footer>

  <script>
    // Horodatage dynamique du bas de page
    function updateFooterTimestamp() {
      const now = new Date();
      const formattedDate = now.toLocaleDateString('fr-FR', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });
      const formattedTime = now.toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      document.getElementById('footer-timestamp').innerText = `Dernière mise à jour : ${formattedDate} à ${formattedTime}`;
    }
    updateFooterTimestamp();
    setInterval(updateFooterTimestamp, 1000);

    // Initialisation BDD Dexie
    const db = new Dexie("PokemonCollectionDB");
    db.version(2).stores({
      cards: 'id, name, setCode, countNormal, countReverse, countHolo, prices'
    });

    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snap-btn');
    const resetBtn = document.getElementById('reset-btn');
    const statusDiv = document.getElementById('status');
    const debugDiv = document.getElementById('debug-ai');
    const resultDiv = document.getElementById('result');
    const selectionGrid = document.getElementById('selection-grid');
    const cameraContainer = document.getElementById('camera-container');

    let currentCardData = null;

    // Démarrage caméra
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { statusDiv.innerText = "Erreur caméra: " + err.message; });

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-scan').style.display = 'none';
      document.getElementById('view-collection').style.display = 'none';

      if (tab === 'scan') {
        document.getElementById('tab-scan-btn').classList.add('active');
        document.getElementById('view-scan').style.display = 'block';
      } else {
        document.getElementById('tab-collection-btn').classList.add('active');
        document.getElementById('view-collection').style.display = 'block';
        loadCollection();
      }
    }

    snapBtn.addEventListener('click', async () => {
      statusDiv.innerText = "Capture et analyse en cours...";
      debugDiv.innerText = "";
      snapBtn.disabled = true;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      try {
        const aiResponse = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: "claude-3-5-sonnet-20241022",
            max_tokens: 150,
            messages: [{
              role: "user",
              content: [
                { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64Image } },
                { type: "text", text: "Identifie cette carte Pokémon. Renvoie UNIQUEMENT un objet JSON valide avec les clés: name (nom anglais ou international), localId (numéro de la carte dans le set ex: '025' ou '12'), setCode (code du set si lisible sinon null). Exemple: {\"name\": \"Pikachu\", \"localId\": \"025\", \"setCode\": \"151\"}" }
              ]
            }]
          })
        });

        if (!aiResponse.ok) {
          throw new Error(`Erreur HTTP: ${aiResponse.status}`);
        }

        const aiData = await aiResponse.json();
        const responseText = aiData.content[0].text;
        debugDiv.innerText = "IA : " + responseText;

        const match = responseText.match(/\{[\s\S]*\}/);
        if (!match) throw new Error("Format de réponse IA invalide");

        const parsed = JSON.parse(match[0]);
        await searchCardInTCGdex(parsed.name, parsed.localId);

      } catch (err) {
        statusDiv.innerText = "Erreur d'analyse IA : " + err.message;
        console.error(err);
        snapBtn.disabled = false;
      }
    });

    async function searchCardInTCGdex(name, localId) {
      statusDiv.innerText = `Recherche TCGdex pour "${name}"...`;
      try {
        const res = await fetch(`https://api.tcgdex.net/v2/fr/cards?name=${encodeURIComponent(name)}`);
        const cards = await res.json();

        if (!Array.isArray(cards) || cards.length === 0) {
          statusDiv.innerText = "Aucune carte trouvée sous ce nom.";
          snapBtn.disabled = false;
          return;
        }

        let matches = cards.filter(c => c.localId === localId || (c.id && c.id.endsWith(`-${localId}`)));

        if (matches.length === 0) {
          matches = cards.slice(0, 4);
        }

        if (matches.length === 1) {
          fetchFullCardDetails(matches[0].id);
        } else if (matches.length > 1) {
          displaySelectionGrid(matches);
        } else {
          statusDiv.innerText = "Aucune carte correspondante trouvée.";
          snapBtn.disabled = false;
        }
      } catch (err) {
        statusDiv.innerText = "Erreur de connexion à TCGdex.";
        snapBtn.disabled = false;
      }
    }

    function displaySelectionGrid(cards) {
      cameraContainer.style.display = 'none';
      snapBtn.style.display = 'none';
      statusDiv.innerText = "Plusieurs cartes correspondent. Choisissez la bonne :";
      selectionGrid.innerHTML = '';
      selectionGrid.style.display = 'grid';

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card-choice';
        div.onclick = () => fetchFullCardDetails(card.id);
        div.innerHTML = `
          <img src="${card.image}/high.png" onerror="this.src='${card.image}/low.png'" alt="${card.name}">
          <p>${card.name} (#${card.localId})</p>
        `;
        selectionGrid.appendChild(div);
      });
    }

    function extractPrices(data) {
      const prices = { normal: 0, reverse: 0, holo: 0 };

      if (data.cardmarket && data.cardmarket.prices) {
        const p = data.cardmarket.prices;
        prices.normal = p.averageSellPrice || p.avg || 0;
        prices.reverse = p.reverseHoloAvg || p["avg-holo"] || 0;
        prices.holo = p.holoAvg || p["avg-holo"] || prices.normal;
      } else if (data.tcgplayer && data.tcgplayer.prices) {
        const p = data.tcgplayer.prices;
        if (p.normal) prices.normal = p.normal.market || p.normal.mid || 0;
        if (p.reverseHolofoil) prices.reverse = p.reverseHolofoil.market || p.reverseHolofoil.mid || 0;
        if (p.holofoil) prices.holo = p.holofoil.market || p.holofoil.mid || 0;
      }

      return prices;
    }

    async function fetchFullCardDetails(cardId) {
      selectionGrid.style.display = 'none';
      statusDiv.innerText = "Chargement des détails...";

      try {
        const res = await fetch(`https://api.tcgdex.net/v2/fr/cards/${cardId}`);
        const data = await res.json();

        const prices = extractPrices(data);

        currentCardData = {
          id: data.id,
          name: data.name,
          localId: data.localId,
          setCode: data.set ? data.set.name : 'Inconnu',
          image: `${data.image}/high.png`,
          prices: prices
        };

        const existing = await db.cards.get(data.id);
        showCardResult(currentCardData, existing);

      } catch (err) {
        statusDiv.innerText = "Erreur de chargement des détails.";
        snapBtn.disabled = false;
      }
    }

    function showCardResult(card, existing) {
      cameraContainer.style.display = 'none';
      snapBtn.style.display = 'none';
      resetBtn.style.display = 'block';
      statusDiv.innerText = "Carte identifiée !";

      const cNormal = existing ? (existing.countNormal || 0) : 0;
      const cReverse = existing ? (existing.countReverse || 0) : 0;
      const cHolo = existing ? (existing.countHolo || 0) : 0;

      const totalOwned = cNormal + cReverse + cHolo;
      const badgeHtml = totalOwned > 0 
        ? `<span class="badge badge-owned">Possédée (${totalOwned})</span>`
        : `<span class="badge badge-new">Nouvelle carte</span>`;

      resultDiv.innerHTML = `
        <img src="${card.image}" onerror="this.src='${card.image.replace('/high.png','/low.png')}'" alt="${card.name}">
        <h3>${card.name}</h3>
        <p style="font-size:0.8rem; color:var(--text-muted); margin: -4px 0 8px;">Ext: ${card.setCode} (#${card.localId})</p>
        ${badgeHtml}

        <div class="price-list">
          <div class="price-item"><span>Normal :</span><span class="val">${card.prices.normal ? card.prices.normal.toFixed(2) + ' €' : 'N/A'}</span></div>
          <div class="price-item"><span>Reverse :</span><span class="val">${card.prices.reverse ? card.prices.reverse.toFixed(2) + ' €' : 'N/A'}</span></div>
          <div class="price-item"><span>Holo :</span><span class="val">${card.prices.holo ? card.prices.holo.toFixed(2) + ' €' : 'N/A'}</span></div>
        </div>

        <p style="font-size:0.8rem; font-weight:bold; margin-top:12px;">Ajouter à la collection :</p>
        <div class="btn-group">
          <button class="action-btn secondary" onclick="addCardVariant('normal')">+ Normal</button>
          <button class="action-btn btn-reverse" onclick="addCardVariant('reverse')">+ Reverse</button>
          <button class="action-btn btn-holo" onclick="addCardVariant('holo')">+ Holo</button>
        </div>
      `;
      resultDiv.style.display = 'block';
    }

    async function addCardVariant(variant) {
      if (!currentCardData) return;

      let card = await db.cards.get(currentCardData.id);

      if (!card) {
        card = {
          id: currentCardData.id,
          name: currentCardData.name,
          localId: currentCardData.localId,
          setCode: currentCardData.setCode,
          image: currentCardData.image,
          prices: currentCardData.prices,
          countNormal: 0,
          countReverse: 0,
          countHolo: 0
        };
      }

      if (variant === 'normal') card.countNormal = (card.countNormal || 0) + 1;
      if (variant === 'reverse') card.countReverse = (card.countReverse || 0) + 1;
      if (variant === 'holo') card.countHolo = (card.countHolo || 0) + 1;

      await db.cards.put(card);
      statusDiv.innerText = `Ajouté en version ${variant.toUpperCase()} !`;
      
      const updated = await db.cards.get(card.id);
      showCardResult(currentCardData, updated);
    }

    function resetScan() {
      resultDiv.style.display = 'none';
      selectionGrid.style.display = 'none';
      cameraContainer.style.display = 'block';
      snapBtn.style.display = 'block';
      resetBtn.style.display = 'none';
      snapBtn.disabled = false;
      statusDiv.innerText = "Prêt !";
      debugDiv.innerText = "";
      currentCardData = null;
    }

    async function updateQuantity(id, variant, delta) {
      const card = await db.cards.get(id);
      if (!card) return;

      if (variant === 'normal') card.countNormal = Math.max(0, (card.countNormal || 0) + delta);
      if (variant === 'reverse') card.countReverse = Math.max(0, (card.countReverse || 0) + delta);
      if (variant === 'holo') card.countHolo = Math.max(0, (card.countHolo || 0) + delta);

      const total = (card.countNormal || 0) + (card.countReverse || 0) + (card.countHolo || 0);

      if (total === 0) {
        await db.cards.delete(id);
      } else {
        await db.cards.put(card);
      }

      loadCollection();
    }

    async function removeCardCompletely(id) {
      if (confirm("Supprimer cette carte de la collection ?")) {
        await db.cards.delete(id);
        loadCollection();
      }
    }

    async function loadCollection() {
      const listDiv = document.getElementById('collection-list');
      const statsDiv = document.getElementById('collection-stats');
      listDiv.innerHTML = '';

      const cards = await db.cards.toArray();

      let totalCards = cards.length;
      let totalQuantity = 0;
      let totalPrice = 0;

      if (cards.length === 0) {
        listDiv.innerHTML = '<p style="color: var(--text-muted); padding: 20px;">Votre collection est vide pour le moment.</p>';
        statsDiv.innerHTML = `<div>Cartes : 0 | Exemplaires : 0</div><div>Valeur estimée : <span class="total-val">0.00 €</span></div>`;
        return;
      }

      cards.forEach(card => {
        const cNorm = card.countNormal || 0;
        const cRev = card.countReverse || 0;
        const cHolo = card.countHolo || 0;
        const sum = cNorm + cRev + cHolo;

        totalQuantity += sum;

        const pNorm = (card.prices && card.prices.normal) ? card.prices.normal : 0;
        const pRev = (card.prices && card.prices.reverse) ? card.prices.reverse : 0;
        const pHolo = (card.prices && card.prices.holo) ? card.prices.holo : 0;

        const cardTotalValue = (cNorm * pNorm) + (cRev * pRev) + (cHolo * pHolo);
        totalPrice += cardTotalValue;

        const div = document.createElement('div');
        div.className = 'collection-item';
        div.innerHTML = `
          <img src="${card.image}" onerror="this.src='${card.image.replace('/high.png','/low.png')}'" alt="${card.name}">
          <div class="collection-info">
            <div class="item-header">
              <h4>${card.name}</h4>
              <button class="delete-btn" onclick="removeCardCompletely('${card.id}')">✕</button>
            </div>
            <p class="id-txt">${card.setCode} (#${card.localId})</p>

            <div class="qty-row">
              <span>Norm : ${cNorm} (${pNorm ? pNorm.toFixed(2) : '0.00'}€)</span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQuantity('${card.id}', 'normal', -1)">-</button>
                <button class="qty-btn" onclick="updateQuantity('${card.id}', 'normal', 1)">+</button>
              </div>
            </div>

            <div class="qty-row">
              <span>Rev : ${cRev} (${pRev ? pRev.toFixed(2) : '0.00'}€)</span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQuantity('${card.id}', 'reverse', -1)">-</button>
                <button class="qty-btn" onclick="updateQuantity('${card.id}', 'reverse', 1)">+</button>
              </div>
            </div>

            <div class="qty-row">
              <span>Holo : ${cHolo} (${pHolo ? pHolo.toFixed(2) : '0.00'}€)</span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQuantity('${card.id}', 'holo', -1)">-</button>
                <button class="qty-btn" onclick="updateQuantity('${card.id}', 'holo', 1)">+</button>
              </div>
            </div>
          </div>
        `;
        listDiv.appendChild(div);
      });

      statsDiv.innerHTML = `
        <div>Cartes uniques : ${totalCards} | Exemplaires : ${totalQuantity}</div>
        <div>Valeur estimée : <span class="total-val">${totalPrice.toFixed(2)} €</span></div>
      `;
    }

    async function exportCollection() {
      const cards = await db.cards.toArray();
      const blob = new Blob([JSON.stringify(cards, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pokemon_collection_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function importCollection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const cards = JSON.parse(e.target.result);
          if (Array.isArray(cards)) {
            await db.cards.bulkPut(cards);
            alert("Collection importée avec succès !");
            loadCollection();
          } else {
            alert("Format JSON invalide.");
          }
        } catch (err) {
          alert("Erreur lors de la lecture du fichier JSON.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
