<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Scanner PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --price-color: #10b981;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      margin: 0;
      padding: 16px 12px 32px;
      background-color: var(--bg-color);
      color: var(--text-main);
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-wrapper { flex: 1; }

    .tabs {
      display: flex;
      gap: 6px;
      max-width: 420px;
      margin: 0 auto 16px;
      background: #1e293b;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .logo-container {
      max-width: 420px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: center;
    }

    .app-logo {
      width: 160px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .views { max-width: 420px; margin: 0 auto; }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.instructions { font-size: 0.85rem; color: var(--text-muted); margin-top: 0; margin-bottom: 16px; }

    .camera-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    video { width: 100%; display: block; border-radius: 14px; }

    button.action-btn {
      margin-top: 14px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      transition: transform 0.1s ease;
    }

    button.action-btn:active { transform: scale(0.98); }
    button.secondary { background: #334155; box-shadow: none; }
    button.btn-reverse { background: linear-gradient(135deg, #a855f7, #7e22ce); box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3); }
    button.btn-holo { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status { margin-top: 12px; font-size: 0.9rem; color: #cbd5e1; font-weight: 500; }
    #debug-ai { font-size: 0.8rem; color: #818cf8; margin-top: 4px; font-family: monospace; }

    #selection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px auto; }

    .card-choice {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
    }

    .card-choice:hover { border-color: var(--primary); }
    .card-choice img { width: 100%; border-radius: 8px; }
    .card-choice p { margin: 6px 0 0; font-size: 0.75rem; font-weight: 600; color: var(--text-main); }

    .card-result {
      margin-top: 16px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .card-result img { max-width: 170px; border-radius: 10px; box-shadow: 0 6px 12px rgba(0,0,0,0.4); }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .badge-owned { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-new { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }

    .variant-box {
      margin-top: 14px;
      text-align: left;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
    }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn-group button { margin-top: 0; font-size: 0.8rem; padding: 10px 4px; }

    .collection-stats {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      color: #a5b4fc;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .collection-stats span.total-val { color: var(--price-color); font-size: 1.05rem; }

    .backup-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .backup-actions button {
      margin-top: 0;
      font-size: 0.8rem;
      padding: 10px;
    }

    .collection-grid-view { display: flex; flex-direction: column; gap: 12px; }

    .collection-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      text-align: left;
      border: 1px solid var(--border-color);
    }

    .collection-item img {
      width: 70px;
      height: 98px;
      object-fit: contain;
      border-radius: 6px;
      background: #0f172a;
      flex-shrink: 0;
    }

    .collection-info { flex: 1; min-width: 0; }
    .collection-info h4 { margin: 0 0 2px 0; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .collection-info p.id-txt { margin: 0 0 6px 0; font-size: 0.75rem; color: var(--text-muted); }

    .qty-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 0.78rem; color: #cbd5e1; }
    .qty-controls { display: flex; gap: 4px; align-items: center; }
    
    .qty-btn {
      width: 22px; height: 22px; padding: 0; border: 1px solid var(--border-color);
      background: #334155; color: white; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .qty-btn:active { background: var(--primary); }

    .delete-btn { background: transparent; color: #f87171; border: none; padding: 4px; font-size: 0.8rem; cursor: pointer; opacity: 0.8; margin-left: auto; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; }

    footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="tabs">
      <button class="tab-btn active" id="tab-scan-btn" onclick="switchTab('scan')">Scanner</button>
      <button class="tab-btn" id="tab-collection-btn" onclick="switchTab('collection')">Ma Collection</button>
    </div>

    <div class="logo-container">
      <img src="logo.jpg" alt="TCG Manager Logo" class="app-logo">
    </div>

    <div class="views">
      <div id="view-scan">
        <h1>Scanner AI TCG</h1>
        <p class="instructions">Placer la carte au centre du cadre</p>

        <div class="camera-box" id="camera-container">
          <video id="video" autoplay playsinline></video>
        </div>

        <button id="snap-btn" class="action-btn">Analyser la carte</button>
        <button id="reset-btn" class="action-btn secondary" style="display: none;" onclick="resetScan()">Scanner une autre carte</button>
        
        <div id="status">Prêt !</div>
        <div id="debug-ai"></div>

        <div id="selection-grid" style="display: none;"></div>
        <div id="result" class="card-result" style="display: none;"></div>
      </div>

      <div id="view-collection" style="display: none;">
        <h1>Ma Collection</h1>
        <div class="collection-stats" id="collection-stats">Chargement...</div>

        <div class="backup-actions">
          <button class="action-btn secondary" onclick="exportCollection()">Exporter JSON</button>
          <button class="action-btn secondary" onclick="document.getElementById('import-file').click()">Importer JSON</button>
          <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importCollection(event)">
        </div>

        <div id="collection-list" class="collection-grid-view"></div>
      </div>
    </div>
  </div>

  <footer>
    Version du fichier : <span id="build-timestamp"></span>
  </footer>

  <script>
    const LAST_BUILD = "2026-08-24T16:04:00";
    document.getElementById("build-timestamp").textContent = new Date(LAST_BUILD).toLocaleString("fr-FR", {
      dateStyle: "short",
      timeStyle: "short"
    });

    var db = new Dexie("TCGCollection");
    db.version(5).stores({ cards: "id, name, image" });

    var video = document.getElementById("video");
    var snapBtn = document.getElementById("snap-btn");
    var resetBtn = document.getElementById("reset-btn");
    var status = document.getElementById("status");
    var debugAi = document.getElementById("debug-ai");
    var resultDiv = document.getElementById("result");
    var selectionGrid = document.getElementById("selection-grid");
    var cameraContainer = document.getElementById("camera-container");

    var currentCardData = null;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } } })
      .then(function(stream) { video.srcObject = stream; })
      .catch(function(err) { status.innerText = "Erreur caméra : " + err.message; });

    async function switchTab(tab) {
      document.getElementById("tab-scan-btn").classList.toggle("active", tab === "scan");
      document.getElementById("tab-collection-btn").classList.toggle("active", tab === "collection");
      document.getElementById("view-scan").style.display = (tab === "scan") ? "block" : "none";
      document.getElementById("view-collection").style.display = (tab === "collection") ? "block" : "none";

      if (tab === "collection") {
        await renderCollection();
      }
    }

    function getCardImageUrl(card) {
      if (card && card.image) {
        if (card.image.endsWith(".png") || card.image.endsWith(".jpg")) return card.image;
        return card.image + "/low.png";
      }
      if (card && card.id) {
        var parts = card.id.split('-');
        if (parts.length >= 2) {
          return "https://assets.tcgdex.net/fr/" + parts[0] + "/" + parts[1] + "/low.png";
        }
      }
      return "https://via.placeholder.com/150x210/1e293b/94a3b8?text=Image+Indisponible";
    }

    snapBtn.addEventListener("click", async function() {
      snapBtn.disabled = true;
      status.innerText = "Analyse par l'IA...";
      debugAi.innerText = "";

      var canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      var base64Image = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];

      try {
        var apiRes = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64Image })
        });

        var apiData = await apiRes.json();
        if (apiData.error) throw new Error(apiData.error);

        var rawCardName = (apiData.name || "").trim();
        debugAi.innerText = 'IA a trouvé : "' + rawCardName + '"';

        if (!rawCardName) {
          status.innerText = "Carte non reconnue. Réessayez.";
          snapBtn.disabled = false;
          return;
        }

        // Nettoyage des suffixes pour l'API TCGdex (ex: "Majaspic ex" -> "Majaspic")
        var cleanSearchName = rawCardName.replace(/\b(ex|vmax|vstar|gx|v)\b/gi, "").trim();

        status.innerText = 'Recherche TCGdex pour "' + cleanSearchName + '"...';
        
        var res = await fetch("https://api.tcgdex.net/v2/fr/cards?name=" + encodeURIComponent(cleanSearchName));
        if (!res.ok) throw new Error("Erreur TCGdex (" + res.status + ")");

        var rawData = await res.json();
        var cardsList = Array.isArray(rawData) ? rawData : (rawData ? [rawData] : []);

        if (cardsList.length === 0) {
          status.innerText = 'Aucune carte trouvée pour "' + cleanSearchName + '".';
          resetBtn.style.display = "block";
          snapBtn.style.display = "none";
          return;
        }

        if (cardsList.length === 1) {
          await fetchFullCardDetailsAndDisplay(cardsList[0].id);
        } else {
          showEditionSelection(cardsList);
        }

      } catch (err) {
        status.innerText = "Erreur : " + err.message;
        resetBtn.style.display = "block";
        snapBtn.style.display = "none";
      }
    });

    function showEditionSelection(cards) {
      status.innerText = cards.length + " versions trouvées. Choisis la tienne :";
      cameraContainer.style.display = "none";
      snapBtn.style.display = "none";
      resetBtn.style.display = "block";
      selectionGrid.innerHTML = "";
      selectionGrid.style.display = "grid";

      cards.slice(0, 20).forEach(function(card) {
        var div = document.createElement("div");
        div.className = "card-choice";
        
        var img = document.createElement("img");
        img.src = getCardImageUrl(card);
        img.alt = card.name || "Carte";

        var pName = document.createElement("p");
        pName.textContent = card.name || "Inconnu";

        var pId = document.createElement("p");
        pId.style.color = "var(--text-muted)";
        pId.style.fontWeight = "normal";
        pId.textContent = card.id || "";

        div.appendChild(img);
        div.appendChild(pName);
        div.appendChild(pId);

        div.onclick = function() {
          selectionGrid.style.display = "none";
          fetchFullCardDetailsAndDisplay(card.id);
        };

        selectionGrid.appendChild(div);
      });
    }

    async function fetchFullCardDetailsAndDisplay(cardId) {
      status.innerText = "Chargement des détails...";
      try {
        var res = await fetch("https://api.tcgdex.net/v2/fr/cards/" + cardId);
        var fullCard = await res.json();
        checkAndDisplayCard(fullCard);
      } catch (e) {
        status.innerText = "Erreur au chargement de la carte.";
      }
    }

    async function checkAndDisplayCard(card) {
      currentCardData = card;
      cameraContainer.style.display = "none";
      snapBtn.style.display = "none";
      selectionGrid.style.display = "none";
      resetBtn.style.display = "block";
      
      var localCard = await db.cards.get(card.id) || { countNormal: 0, countReverse: 0, countHolo: 0 };
      var totalOwned = (localCard.countNormal || 0) + (localCard.countReverse || 0) + (localCard.countHolo || 0);

      resultDiv.innerHTML = "";
      
      var img = document.createElement("img");
      img.src = getCardImageUrl(card);
      img.alt = card.name;

      var h3 = document.createElement("h3");
      h3.style.margin = "10px 0 2px";
      h3.textContent = card.name;

      var pId = document.createElement("p");
      pId.style.margin = "0";
      pId.style.color = "var(--text-muted)";
      pId.style.fontSize = "0.85rem";
      pId.textContent = "ID : " + card.id;

      var badge = document.createElement("div");
      badge.className = "badge " + (totalOwned > 0 ? "badge-owned" : "badge-new");
      badge.textContent = totalOwned > 0 ? ("En possession (Total : x" + totalOwned + ")") : "Nouvelle carte !";

      var variantBox = document.createElement("div");
      variantBox.className = "variant-box";
      variantBox.innerHTML = '<p style="margin:4px 0;">Normal : x' + (localCard.countNormal || 0) + '</p>' +
                             '<p style="margin:4px 0;">Reverse : x' + (localCard.countReverse || 0) + '</p>' +
                             '<p style="margin:4px 0;">Holo : x' + (localCard.countHolo || 0) + '</p>';

      var btnGroup = document.createElement("div");
      btnGroup.className = "btn-group";

      var btnNormal = document.createElement("button");
      btnNormal.className = "action-btn";
      btnNormal.textContent = "+ Normal";
      btnNormal.onclick = function() { addVariant("countNormal"); };

      var btnReverse = document.createElement("button");
      btnReverse.className = "action-btn btn-reverse";
      btnReverse.textContent = "+ Reverse";
      btnReverse.onclick = function() { addVariant("countReverse"); };

      var btnHolo = document.createElement("button");
      btnHolo.className = "action-btn btn-holo";
      btnHolo.textContent = "+ Holo";
      btnHolo.onclick = function() { addVariant("countHolo"); };

      btnGroup.appendChild(btnNormal);
      btnGroup.appendChild(btnReverse);
      btnGroup.appendChild(btnHolo);

      status.innerText = "";
      resultDiv.style.display = "block";
      
      resultDiv.appendChild(img);
      resultDiv.appendChild(h3);
      resultDiv.appendChild(pId);
      resultDiv.appendChild(badge);
      resultDiv.appendChild(variantBox);
      resultDiv.appendChild(btnGroup);
    }

    async function addVariant(variantType) {
      if (!currentCardData) return;
      var id = currentCardData.id;

      var localCard = await db.cards.get(id) || { 
        id: id, name: currentCardData.name, image: getCardImageUrl(currentCardData), 
        countNormal: 0, countReverse: 0, countHolo: 0 
      };
      
      localCard.image = getCardImageUrl(currentCardData);
      localCard[variantType] = (localCard[variantType] || 0) + 1;
      
      await db.cards.put(localCard);
      checkAndDisplayCard(currentCardData);
    }

    function resetScan() {
      currentCardData = null;
      resultDiv.style.display = "none";
      selectionGrid.style.display = "none";
      resetBtn.style.display = "none";
      cameraContainer.style.display = "block";
      snapBtn.style.display = "block";
      snapBtn.disabled = false;
      debugAi.innerText = "";
      status.innerText = "Prêt !";
    }

    async function renderCollection() {
      var listContainer = document.getElementById("collection-list");
      var statsContainer = document.getElementById("collection-stats");
      var allCards = await db.cards.toArray();
      var ownedCards = allCards.filter(function(c) {
        return ((c.countNormal || 0) + (c.countReverse || 0) + (c.countHolo || 0)) > 0;
      });

      var totalCardsCount = 0;
      var totalEstValue = 0;

      ownedCards.forEach(function(c) {
        var qNorm = c.countNormal || 0;
        var qRev = c.countReverse || 0;
        var qHolo = c.countHolo || 0;

        totalCardsCount += qNorm + qRev + qHolo;

        var valNorm = qNorm * (c.priceEurNormal || c.priceEur || 0);
        var valRev = qRev * (c.priceEurReverse || c.priceEurNormal || c.priceEur || 0);
        var valHolo = qHolo * (c.priceEurHolo || c.priceEurNormal || c.priceEur || 0);

        totalEstValue += valNorm + valRev + valHolo;
      });

      statsContainer.innerHTML = "";
      var statsInfo = document.createElement("div");
      statsInfo.textContent = ownedCards.length + " uniques | " + totalCardsCount + " exemplaires";
      var statsVal = document.createElement("span");
      statsVal.className = "total-val";
      statsVal.textContent = "Valeur estimée : ~" + totalEstValue.toFixed(2) + " €";
      statsContainer.appendChild(statsInfo);
      statsContainer.appendChild(statsVal);

      if (ownedCards.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--text-muted); margin-top: 24px;">Votre collection est vide.</p>';
        return;
      }

      listContainer.innerHTML = "";
      
      ownedCards.forEach(function(card) {
        var imgUrl = getCardImageUrl(card);

        var div = document.createElement("div");
        div.className = "collection-item";
        
        var img = document.createElement("img");
        img.src = imgUrl;
        img.alt = card.name;
        img.loading = "lazy";
        
        var info = document.createElement("div");
        info.className = "collection-info";
        
        var header = document.createElement("div");
        header.className = "item-header";
        
        var h4 = document.createElement("h4");
        h4.textContent = card.name;
        
        var delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "Supprimer";
        delBtn.onclick = function() { deleteCardFromCollection(card.id); };
        
        header.appendChild(h4);
        header.appendChild(delBtn);
        
        var idTxt = document.createElement("p");
        idTxt.className = "id-txt";
        idTxt.textContent = card.id;

        info.appendChild(header);
        info.appendChild(idTxt);

        var variantConfigs = [
          { label: "Normal", key: "countNormal", price: card.priceEurNormal || card.priceEur },
          { label: "Reverse", key: "countReverse", price: card.priceEurReverse || card.priceEurNormal || card.priceEur },
          { label: "Holo", key: "countHolo", price: card.priceEurHolo || card.priceEurNormal || card.priceEur }
        ];

        variantConfigs.forEach(function(v) {
          var qtyRow = document.createElement("div");
          qtyRow.className = "qty-row";
          
          var priceText = v.price ? " (" + Number(v.price).toFixed(2) + " €)" : "";
          var span = document.createElement("span");
          span.innerHTML = v.label + priceText + " : <strong>" + (card[v.key] || 0) + "</strong>";
          
          var controls = document.createElement("div");
          controls.className = "qty-controls";
          
          var btnMinus = document.createElement("button");
          btnMinus.className = "qty-btn";
          btnMinus.textContent = "-";
          btnMinus.onclick = function() { updateCollectionQty(card.id, v.key, -1); };

          var btnPlus = document.createElement("button");
          btnPlus.className = "qty-btn";
          btnPlus.textContent = "+";
          btnPlus.onclick = function() { updateCollectionQty(card.id, v.key, 1); };

          controls.appendChild(btnMinus);
          controls.appendChild(btnPlus);
          qtyRow.appendChild(span);
          qtyRow.appendChild(controls);
          info.appendChild(qtyRow);
        });

        div.appendChild(img);
        div.appendChild(info);
        listContainer.appendChild(div);
      });
    }

    async function exportCollection() {
      try {
        var allCards = await db.cards.toArray();
        if (allCards.length === 0) {
          alert("Votre collection est vide !");
          return;
        }
        var jsonStr = JSON.stringify(allCards, null, 2);
        var blob = new Blob([jsonStr], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var dateStr = new Date().toISOString().slice(0, 10);
        var a = document.createElement("a");
        a.href = url;
        a.download = "tcg_collection_backup_" + dateStr + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Erreur d'exportation : " + err.message);
      }
    }

    function importCollection(event) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = async function(e) {
        try {
          var importedData = JSON.parse(e.target.result);
          if (!Array.isArray(importedData)) throw new Error("Format JSON invalide.");

          if (confirm("Importer cette sauvegarde ?")) {
            await db.cards.bulkPut(importedData);
            await renderCollection();
            alert("Collection importée ! (" + importedData.length + " références)");
          }
        } catch (err) {
          alert("Erreur d'importation : " + err.message);
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    async function updateCollectionQty(cardId, variantType, delta) {
      var card = await db.cards.get(cardId);
      if (!card) return;
      card[variantType] = Math.max(0, (card[variantType] || 0) + delta);
      await db.cards.put(card);
      await renderCollection();
    }

    async function deleteCardFromCollection(cardId) {
      if (confirm("Supprimer cette carte ?")) {
        await db.cards.delete(cardId);
        await renderCollection();
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
