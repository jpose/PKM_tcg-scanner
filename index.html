<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Carte Pokémon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700 p-6 flex flex-col items-center">
    
    <h1 class="text-2xl font-bold mb-4 text-center text-amber-400">Scanner de Carte</h1>

    <!-- 1. Vue Caméra -->
    <div id="cameraView" class="w-full flex flex-col items-center">
      <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden mb-4 border-2 border-amber-400/50 shadow-inner">
        <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
      </div>
      <button onclick="captureAndScan()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-xl shadow-lg transition duration-200 text-lg">
        Prendre la photo
      </button>
    </div>

    <!-- 2. Vue Chargement -->
    <div id="loadingView" class="hidden w-full flex flex-col items-center justify-center py-12">
      <div class="animate-spin rounded-full h-16 w-16 border-4 border-amber-400 border-t-transparent mb-4"></div>
      <p class="text-slate-300 font-medium text-center">Analyse IA & estimation en cours...</p>
    </div>

    <!-- 3. Vue Résultat -->
    <div id="resultView" class="hidden w-full flex flex-col items-center">
      <div id="errorBox" class="hidden w-full p-4 mb-4 bg-red-900/50 border border-red-500 rounded-xl text-red-200 text-sm text-center"></div>

      <img id="cardImg" src="" alt="Carte Pokémon" class="w-48 h-64 object-contain rounded-lg shadow-xl mb-4 border border-slate-600 bg-slate-950 hidden">
      
      <h2 id="cardName" class="text-xl font-bold text-center mb-1 text-white"></h2>
      <p id="cardSet" class="text-slate-400 text-sm text-center mb-4"></p>
      
      <div class="bg-slate-700/50 px-6 py-3 rounded-xl border border-slate-600 mb-6 text-center w-full shadow-inner">
        <span class="text-xs text-slate-400 uppercase tracking-wider block font-semibold">Cote Cardmarket</span>
        <span id="cardPrice" class="text-3xl font-black text-amber-400"></span>
      </div>

      <button onclick="startCamera()" class="w-full py-3.5 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl transition duration-200 text-white">
        Scanner une autre carte
      </button>
    </div>

  </div>

  <script>
    const video = document.getElementById('video');
    const cameraView = document.getElementById('cameraView');
    const loadingView = document.getElementById('loadingView');
    const resultView = document.getElementById('resultView');
    const errorBox = document.getElementById('errorBox');
    
    let currentStream = null;

    // Démarrage de la caméra
    async function startCamera() {
      resultView.classList.add('hidden');
      loadingView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      errorBox.classList.add('hidden');

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = currentStream;
      } catch (err) {
        showError("Impossible d'accéder à la caméra. Vérifiez les autorisations de votre navigateur.");
        cameraView.classList.add('hidden');
        resultView.classList.remove('hidden');
      }
    }

    // Arrêt du flux vidéo
    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    // Affichage des erreurs
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    // Capture de la photo et appel de l'API Vercel
    async function captureAndScan() {
      if (!currentStream) return;

      const canvas = document.createElement('canvas');
      const maxDim = 800; // Taille idéale pour Gemini 1.5 Flash (lisible et très rapide)
      let w = video.videoWidth || 640;
      let h = video.videoHeight || 480;

      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      // Compression à 60% : le fichier pèse moins de 100 Ko
      const imageData = canvas.toDataURL('image/jpeg', 0.6);

      stopCamera();
      cameraView.classList.add('hidden');
      loadingView.classList.remove('hidden');

      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        });

        const data = await response.json();

        loadingView.classList.add('hidden');
        resultView.classList.remove('hidden');

        if (!response.ok || data.error) {
          return showError(data.error || "Une erreur est survenue lors du traitement.");
        }

        // Affichage des résultats renvoyés par l'API
        document.getElementById('cardName').textContent = data.cardName;
        document.getElementById('cardSet').textContent = data.setName;
        document.getElementById('cardPrice').textContent = data.price > 0 ? `${data.price.toFixed(2)} €` : 'Non cotée';
        
        const imgEl = document.getElementById('cardImg');
        imgEl.src = data.imageUrl;
        imgEl.classList.remove('hidden');

      } catch (err) {
        loadingView.classList.add('hidden');
        resultView.classList.remove('hidden');
        showError("Erreur de connexion avec le serveur : " + err.message);
      }
    }

    // Initialisation automatique de la caméra au chargement
    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
