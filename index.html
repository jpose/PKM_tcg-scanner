<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Carte Pokémon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    #camera-view, #result-view {
      width: 100%;
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    video {
      width: 100%;
      height: 350px;
      object-fit: cover;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: #0284c7;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    /* Styles pour la fiche de résultat */
    .card-info {
      padding: 20px;
      width: 100%;
      text-align: center;
    }

    .card-image {
      max-width: 200px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .card-set {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .card-price {
      font-size: 1.5rem;
      color: #4ade80;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .loader {
      padding: 20px;
      text-align: center;
      color: #38bdf8;
      font-weight: bold;
    }

    .error-msg {
      color: #f87171;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Scanner de Carte Pokémon</h1>

    <!-- Vue Appareil Photo -->
    <div id="camera-view">
      <video id="webcam" autoplay playsinline></video>
      <div style="padding: 15px; width: 100%;">
        <button id="scan-btn" class="btn">Prendre en photo & Scanner</button>
      </div>
    </div>

    <!-- Indicateur de chargement -->
    <div id="loading" class="loader hidden">Analyse de la carte en cours...</div>

    <!-- Vue Résultat -->
    <div id="result-view" class="hidden">
      <div class="card-info">
        <img id="card-img" class="card-image hidden" src="" alt="Carte Pokémon">
        <div id="card-name" class="card-title">--</div>
        <div id="card-set" class="card-set">--</div>
        <div id="card-price" class="card-price">-- €</div>
        <div id="error-box" class="error-msg hidden"></div>
        <button id="retry-btn" class="btn" style="margin-top: 10px;">Scanner une autre carte</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const scanBtn = document.getElementById('scan-btn');
    const retryBtn = document.getElementById('retry-btn');
    const cameraView = document.getElementById('camera-view');
    const resultView = document.getElementById('result-view');
    const loadingView = document.getElementById('loading');

    const cardImg = document.getElementById('card-img');
    const cardName = document.getElementById('card-name');
    const cardSet = document.getElementById('card-set');
    const cardPrice = document.getElementById('card-price');
    const errorBox = document.getElementById('error-box');

    let currentStream = null;

    // 1. Démarrer la flux caméra
    async function startCamera() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' } // Préfère la caméra arrière sur mobile
        });
        video.srcObject = currentStream;
      } catch (err) {
        alert("Impossible d'accéder à la caméra : " + err.message);
      }
    }

    // 2. Arrêter la caméra pour couper la prise de vue
    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
        video.srcObject = null;
      }
    }

    // 3. Capture et envoi de la photo
    async function captureAndScan() {
      if (!currentStream) return;

      // Création d'un canvas pour extraire l'image courante
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = canvas.toDataURL('image/jpeg');

      // --- ARRÊT DE LA CAMÉRA APRÈS LA CAPTURE ---
      stopCamera();

      // Bascule de l'interface
      cameraView.classList.add('hidden');
      loadingView.classList.remove('hidden');

      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        });

        const data = await response.json();
        loadingView.classList.add('hidden');
        resultView.classList.remove('hidden');

        if (!response.ok || data.error) {
          showError(data.error || 'Erreur lors de l\'analyse');
          return;
        }

        // Affichage des données
        errorBox.classList.add('hidden');
        cardName.textContent = data.cardName || 'Carte inconnue';
        cardSet.textContent = data.setName || 'Extension inconnue';
        cardPrice.textContent = `${data.estimatedPrice ?? 0} €`;

        if (data.imageUrl) {
          cardImg.src = data.imageUrl;
          cardImg.classList.remove('hidden');
        } else {
          cardImg.classList.add('hidden');
        }

      } catch (err) {
        loadingView.classList.add('hidden');
        resultView.classList.remove('hidden');
        showError('Erreur de connexion : ' + err.message);
      }
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
      cardName.textContent = 'Erreur';
      cardSet.textContent = '';
      cardPrice.textContent = '';
      cardImg.classList.add('hidden');
    }

    // Événements
    scanBtn.addEventListener('click', captureAndScan);

    retryBtn.addEventListener('click', () => {
      resultView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      startCamera(); // Relance la caméra pour une nouvelle capture
    });

    // Lancement de la caméra au chargement
    startCamera();
  </script>
</body>
</html>
