<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Carte Pokémon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700 p-6 flex flex-col items-center">
    
    <h1 class="text-2xl font-bold mb-4 text-center text-amber-400">Scanner de Carte Pokémon</h1>

    <!-- Vue Caméra -->
    <div id="cameraView" class="w-full flex flex-col items-center">
      <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden mb-4 border-2 border-amber-400/50">
        <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
      </div>
      <button id="captureBtn" onclick="captureAndScan()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-xl shadow-lg transition duration-200">
        Prendre la photo
      </button>
    </div>

    <!-- Vue Chargement -->
    <div id="loadingView" class="hidden w-full flex flex-col items-center justify-center py-12">
      <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-amber-400 mb-4"></div>
      <p class="text-slate-300 font-medium">Analyse de la carte en cours...</p>
    </div>

    <!-- Vue Résultat -->
    <div id="resultView" class="hidden w-full flex flex-col items-center">
      
      <!-- Box Erreur -->
      <div id="errorBox" class="hidden w-full p-4 mb-4 bg-red-900/50 border border-red-500 rounded-xl text-red-200 text-sm"></div>

      <!-- Informations Carte -->
      <img id="cardImg" src="" alt="Image de la carte" class="w-48 rounded-lg shadow-md mb-4 hidden border border-slate-600">
      
      <h2 id="cardName" class="text-xl font-bold text-center mb-1"></h2>
      <p id="cardSet" class="text-slate-400 text-sm text-center mb-4"></p>
      
      <div class="bg-slate-700/50 px-6 py-3 rounded-xl border border-slate-600 mb-6 text-center w-full">
        <span class="text-xs text-slate-400 uppercase tracking-wider block">Prix estimé</span>
        <span id="cardPrice" class="text-2xl font-black text-amber-400"></span>
      </div>

      <button onclick="startCamera()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl transition duration-200">
        Scanner une autre carte
      </button>
    </div>

  </div>

  <script>
    const video = document.getElementById('video');
    const cameraView = document.getElementById('cameraView');
    const loadingView = document.getElementById('loadingView');
    const resultView = document.getElementById('resultView');
    const errorBox = document.getElementById('errorBox');
    const cardImg = document.getElementById('cardImg');
    const cardName = document.getElementById('cardName');
    const cardSet = document.getElementById('cardSet');
    const cardPrice = document.getElementById('cardPrice');

    let currentStream = null;

    async function startCamera() {
      resultView.classList.add('hidden');
      loadingView.classList.add('hidden');
      cameraView.classList.remove('hidden');
      errorBox.classList.add('hidden');

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = currentStream;
      } catch (err) {
        showError("Impossible d'accéder à la caméra : " + err.message);
        cameraView.classList.add('hidden');
        resultView.classList.remove('hidden');
      }
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
    }

    async function captureAndScan() {
      if (!currentStream) return;

      // Redimensionnement à 600px max pour alléger le transfert
      const canvas = document.createElement('canvas');
      const maxDim = 600;
      let w = video.videoWidth || 640;
      let h = video.videoHeight || 480;

      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }

      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      // Compression JPEG à 0.5 (fichier très léger, parfait pour l'OCR)
      const imageData = canvas.toDataURL('image/jpeg', 0.5);

      stopCamera();

      cameraView.classList.add('hidden');
      loadingView.classList.remove('hidden');

      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        });

        const responseText = await response.text();
        let data;

        // Validation du format JSON pour éviter le crash en cas d'erreur HTML/Texte
        try {
          data = JSON.parse(responseText);
        } catch (e) {
          loadingView.classList.add('hidden');
          resultView.classList.remove('hidden');
          showError('Erreur serveur (réponse non-JSON) : ' + responseText.slice(0, 100));
          return;
        }

        loadingView.classList.add('hidden');
        resultView.classList.remove('hidden');

        if (!response.ok || data.error) {
          showError(data.error || 'Erreur lors de l\'analyse');
          return;
        }

        errorBox.classList.add('hidden');
        cardName.textContent = data.cardName || 'Carte inconnue';
        cardSet.textContent = data.setName || 'Extension inconnue';
        cardPrice.textContent = `${data.estimatedPrice ?? 0} €`;

        if (data.imageUrl) {
          cardImg.src = data.imageUrl;
          cardImg.classList.remove('hidden');
        } else {
          cardImg.classList.add('hidden');
        }

      } catch (err) {
        loadingView.classList.add('hidden');
        resultView.classList.remove('hidden');
        showError('Erreur de réseau : ' + err.message);
      }
    }

    // Lancement de la caméra à l'ouverture de la page
    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
