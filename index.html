<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Scanner PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --price-color: #10b981;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      margin: 0;
      padding: 16px 12px 32px;
      background-color: var(--bg-color);
      color: var(--text-main);
      text-align: center;
      min-height: 100vh;
    }

    /* Navigation Bar / Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      max-width: 420px;
      margin: 0 auto 20px;
      background: #1e293b;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .views { max-width: 420px; margin: 0 auto; }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.instructions {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 16px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    video { width: 100%; display: block; border-radius: 14px; }

    button.action-btn {
      margin-top: 14px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    button.action-btn:active { transform: scale(0.98); }
    button.secondary { background: #334155; box-shadow: none; }
    button.btn-reverse { background: linear-gradient(135deg, #a855f7, #7e22ce); box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3); }
    button.btn-holo { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status { margin-top: 12px; font-size: 0.9rem; color: #cbd5e1; font-weight: 500; }
    #debug-ai { font-size: 0.8rem; color: #818cf8; margin-top: 4px; font-family: monospace; }

    #selection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px auto;
    }

    .card-choice {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card-choice:hover { transform: translateY(-2px); border-color: var(--primary); }
    .card-choice img { width: 100%; border-radius: 8px; }
    .card-choice p { margin: 6px 0 0; font-size: 0.75rem; font-weight: 600; color: var(--text-main); }

    .card-result {
      margin-top: 16px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .card-result img { max-width: 170px; border-radius: 10px; box-shadow: 0 6px 12px rgba(0,0,0,0.4); }

    .price-box {
      margin: 12px 0;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #34d399;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .badge-owned { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-new { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }

    .variant-box {
      margin-top: 14px;
      text-align: left;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
    }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn-group button { margin-top: 0; font-size: 0.8rem; padding: 10px 4px; }

    /* Collection UI */
    .collection-stats {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      color: #a5b4fc;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .collection-stats span.total-val {
      color: var(--price-color);
      font-size: 1.05rem;
    }

    .collection-grid-view { display: flex; flex-direction: column; gap: 12px; }

    .collection-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      text-align: left;
      border: 1px solid var(--border-color);
    }

    .collection-item img {
      width: 70px;
      height: 98px;
      object-fit: contain;
      border-radius: 6px;
      background: #0f172a;
      flex-shrink: 0;
    }

    .collection-info { flex: 1; min-width: 0; }
    .collection-info h4 { margin: 0 0 2px 0; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .collection-info p.id-txt { margin: 0 0 4px 0; font-size: 0.75rem; color: var(--text-muted); }

    .card-price-tag {
      font-size: 0.75rem;
      color: var(--price-color);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .qty-controls { display: flex; gap: 4px; align-items: center; }
    
    .qty-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--border-color);
      background: #334155;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .qty-btn:active { background: var(--primary); }

    .delete-btn {
      background: transparent;
      color: #f87171;
      border: none;
      padding: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0.8;
      margin-left: auto;
    }

    .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" id="tab-scan-btn" onclick="switchTab('scan')">Scanner</button>
    <button class="tab-btn" id="tab-collection-btn" onclick="switchTab('collection')">Ma Collection</button>
  </div>

  <div class="views">
    
    <!-- VUE 1 : SCANNER -->
    <div id="view-scan">
      <h1>Scanner AI TCG</h1>
      <p class="instructions">Placer la carte au centre du cadre</p>

      <div class="camera-box" id="camera-container">
        <video id="video" autoplay playsinline></video>
      </div>

      <button id="snap-btn" class="action-btn">⚡ Analyser la carte (IA)</button>
      <button id="reset-btn" class="action-btn secondary" style="display: none;" onclick="resetScan()">Scanner une autre carte</button>
      
      <div id="status">Prêt !</div>
      <div id="debug-ai"></div>

      <div id="selection-grid" style="display: none;"></div>
      <div id="result" class="card-result" style="display: none;"></div>
    </div>

    <!-- VUE 2 : MA COLLECTION -->
    <div id="view-collection" style="display: none;">
      <h1>Ma Collection</h1>
      <div class="collection-stats" id="collection-stats">Chargement...</div>
      <div id="collection-list" class="collection-grid-view"></div>
    </div>

  </div>

  <script>
    const db = new Dexie('TCGCollection');
    db.version(4).stores({ cards: 'id, name, image, priceEur, priceUsd, countNormal, countReverse, countHolo' });

    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snap-btn');
    const resetBtn = document.getElementById('reset-btn');
    const status = document.getElementById('status');
    const debugAi = document.getElementById('debug-ai');
    const resultDiv = document.getElementById('result');
    const selectionGrid = document.getElementById('selection-grid');
    const cameraContainer = document.getElementById('camera-container');

    let currentCardData = null;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { status.innerText = 'Erreur caméra : ' + err.message; });

    async function switchTab(tab) {
      document.getElementById('tab-scan-btn').classList.toggle('active', tab === 'scan');
      document.getElementById('tab-collection-btn').classList.toggle('active', tab === 'collection');
      document.getElementById('view-scan').style.display = tab === 'scan' ? 'block' : 'none';
      document.getElementById('view-collection').style.display = tab === 'collection' ? 'block' : 'none';

      if (tab === 'collection') {
        await renderCollection();
      }
    }

    function getCardImageUrl(card) {
      if (card.image) {
        return card.image.endsWith('.png') || card.image.endsWith('.jpg') 
          ? card.image 
          : `${card.image}/low.png`;
      }
      return 'https://via.placeholder.com/75x105/1e293b/94a3b8?text=No+Img';
    }

    // Extrait les cotes de la carte (Cardmarket & TCGPlayer)
    function extractPrices(card) {
      let eur = null;
      let usd = null;

      if (card.pricing) {
        if (card.pricing.cardmarket) {
          eur = card.pricing.cardmarket.trend || card.pricing.cardmarket.avg || card.pricing.cardmarket.low || null;
        }
        if (card.pricing.tcgplayer) {
          const normal = card.pricing.tcgplayer.normal || card.pricing.tcgplayer.holofoil || {};
          usd = normal.midPrice || normal.marketPrice || normal.lowPrice || null;
        }
      }

      return { eur, usd };
    }

    async function renderCollection() {
      const listContainer = document.getElementById('collection-list');
      const statsContainer = document.getElementById('collection-stats');
      
      const allCards = await db.cards.toArray();
      const ownedCards = allCards.filter(c => (c.countNormal || 0) + (c.countReverse || 0) + (c.countHolo || 0) > 0);

      let totalCardsCount = 0;
      let totalEstValue = 0;

      ownedCards.forEach(c => {
        const qty = (c.countNormal || 0) + (c.countReverse || 0) + (c.countHolo || 0);
        totalCardsCount += qty;
        if (c.priceEur) {
          totalEstValue += c.priceEur * qty;
        }
      });

      statsContainer.innerHTML = `
        <div>📦 ${ownedCards.length} uniques | 🎴 ${totalCardsCount} exemplaires</div>
        <span class="total-val">💰 Valeur estimée : ~${totalEstValue.toFixed(2)} €</span>
      `;

      if (ownedCards.length === 0) {
        listContainer.innerHTML = '<p style="color:var(--text-muted); margin-top: 24px;">Votre collection est vide.</p>';
        return;
      }

      listContainer.innerHTML = '';
      
      ownedCards.forEach(card => {
        const imgUrl = getCardImageUrl(card);
        const priceTxt = card.priceEur ? `${card.priceEur.toFixed(2)} € (Cardmarket)` : 'Cote indisponible';

        const div = document.createElement('div');
        div.className = 'collection-item';
        div.innerHTML = `
          <img src="${imgUrl}" alt="${card.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/75x105/1e293b/94a3b8?text=No+Img'">
          <div class="collection-info">
            <div class="item-header">
              <h4>${card.name}</h4>
              <button class="delete-btn" title="Supprimer" onclick="deleteCardFromCollection('${card.id}')">🗑️</button>
            </div>
            <p class="id-txt">${card.id}</p>
            <div class="card-price-tag">🏷️ Cote : ${priceTxt}</div>
            
            <div class="qty-row">
              <span>Normale : <strong>${card.countNormal || 0}</strong></span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateCollectionQty('${card.id}', 'countNormal', -1)">-</button>
                <button class="qty-btn" onclick="updateCollectionQty('${card.id}', 'countNormal', 1)">+</button>
              </div>
            </div>

            <div class="qty-row">
              <span>Reverse : <strong>${card.countReverse || 0}</strong></span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateCollectionQty('${card.id}', 'countReverse', -1)">-</button>
                <button class="qty-btn" onclick="updateCollectionQty('${card.id}', 'countReverse', 1)">+</button>
              </div>
            </div>

            <div class="qty-row">
              <span>Holo : <strong>${card.countHolo || 0}</strong></span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateCollectionQty('${card.id}', 'countHolo', -1)">-</button>
                <button class="qty-btn" onclick="updateCollectionQty('${card.id}', 'countHolo', 1)">+</button>
              </div>
            </div>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    async function updateCollectionQty(cardId, variantType, delta) {
      const card = await db.cards.get(cardId);
      if (!card) return;

      const currentVal = card[variantType] || 0;
      card[variantType] = Math.max(0, currentVal + delta);

      await db.cards.put(card);
      await renderCollection();
    }

    async function deleteCardFromCollection(cardId) {
      if (confirm("Supprimer cette carte de votre collection ?")) {
        await db.cards.delete(cardId);
        await renderCollection();
      }
    }

    snapBtn.addEventListener('click', async () => {
      snapBtn.disabled = true;
      status.innerText = '⚡ Analyse par l\'IA...';
      debugAi.innerText = '';

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      try {
        const apiRes = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });

        const apiData = await apiRes.json();
        if (apiData.error) throw new Error(apiData.error);

        const cardName = apiData.name;
        debugAi.innerText = `IA a trouvé : "${cardName}"`;

        if (!cardName) {
          status.innerText = 'Carte non reconnue. Réessayez.';
          snapBtn.disabled = false;
          return;
        }

        status.innerText = `Recherche de "${cardName}"...`;

        const res = await fetch(`https://api.tcgdex.net/v2/fr/cards?name=${encodeURIComponent(cardName)}`);
        const cards = await res.json();
        const validCards = Array.isArray(cards) ? cards.filter(c => c.image) : [];

        if (!validCards || validCards.length === 0) {
          status.innerText = `Aucune carte trouvée pour "${cardName}".`;
          snapBtn.disabled = false;
          return;
        }

        if (validCards.length === 1) {
          await fetchFullCardDetailsAndDisplay(validCards[0].id);
        } else {
          showEditionSelection(validCards);
        }

      } catch (err) {
        status.innerText = 'Erreur : ' + err.message;
        snapBtn.disabled = false;
      }
    });

    // Récupère la carte complète depuis l'API pour avoir les données pricing
    async function fetchFullCardDetailsAndDisplay(cardId) {
      status.innerText = 'Chargement des détails et cotes...';
      try {
        const res = await fetch(`https://api.tcgdex.net/v2/fr/cards/${cardId}`);
        const fullCard = await res.json();
        checkAndDisplayCard(fullCard);
      } catch (e) {
        status.innerText = 'Erreur lors du chargement de la cote.';
      }
    }

    function showEditionSelection(cards) {
      status.innerText = `${cards.length} cartes trouvées. Choisis la tienne :`;
      cameraContainer.style.display = 'none';
      snapBtn.style.display = 'none';
      resetBtn.style.display = 'block';
      selectionGrid.style.display = 'grid';
      selectionGrid.innerHTML = '';

      cards.slice(0, 20).forEach(card => {
        const imgUrl = getCardImageUrl(card);
        const div = document.createElement('div');
        div.className = 'card-choice';
        div.innerHTML = `
          <img src="${imgUrl}" alt="${card.name}" loading="lazy">
          <p>${card.name}</p>
          <p style="color:var(--text-muted); font-weight:normal;">${card.id}</p>
        `;
        div.onclick = () => {
          selectionGrid.style.display = 'none';
          fetchFullCardDetailsAndDisplay(card.id);
        };
        selectionGrid.appendChild(div);
      });
    }

    async function checkAndDisplayCard(card) {
      currentCardData = card;
      cameraContainer.style.display = 'none';
      snapBtn.style.display = 'none';
      selectionGrid.style.display = 'none';
      resetBtn.style.display = 'block';
      
      const localCard = await db.cards.get(card.id) || { countNormal: 0, countReverse: 0, countHolo: 0 };
      const totalOwned = (localCard.countNormal || 0) + (localCard.countReverse || 0) + (localCard.countHolo || 0);

      const imgUrl = getCardImageUrl(card);
      const prices = extractPrices(card);

      let priceHTML = '';
      if (prices.eur || prices.usd) {
        priceHTML = `
          <div class="price-box">
            📊 Cote estimée : <br>
            ${prices.eur ? `🇪🇺 Cardmarket : ~${prices.eur.toFixed(2)} €` : ''} 
            ${prices.eur && prices.usd ? ' | ' : ''}
            ${prices.usd ? `🇺🇸 TCGPlayer : ~$${prices.usd.toFixed(2)}` : ''}
          </div>
        `;
      } else {
        priceHTML = `<div class="price-box" style="color:var(--text-muted); border-color:var(--border-color); background:transparent;">📊 Cote non disponible</div>`;
      }

      status.innerText = '';
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <img src="${imgUrl}" alt="${card.name}">
        <h3 style="margin: 10px 0 2px;">${card.name}</h3>
        <p style="margin: 0; color: var(--text-muted); font-size: 0.85rem;">Édition / ID : ${card.id}</p>

        ${priceHTML}

        <div class="badge ${totalOwned > 0 ? 'badge-owned' : 'badge-new'}">
          ${totalOwned > 0 ? `En possession (Total : x${totalOwned})` : '✨ Nouvelle carte !'}
        </div>

        <div class="variant-box">
          <p style="margin: 4px 0;">⚪ <strong>Normal :</strong> x${localCard.countNormal || 0}</p>
          <p style="margin: 4px 0;">🟣 <strong>Reverse :</strong> x${localCard.countReverse || 0}</p>
          <p style="margin: 4px 0;">🟡 <strong>Holo :</strong> x${localCard.countHolo || 0}</p>
        </div>

        <div class="btn-group">
          <button onclick="addVariant('countNormal')" class="action-btn">+ Normal</button>
          <button onclick="addVariant('countReverse')" class="action-btn btn-reverse">+ Reverse</button>
          <button onclick="addVariant('countHolo')" class="action-btn btn-holo">+ Holo</button>
        </div>
      `;
    }

    async function addVariant(variantType) {
      if (!currentCardData) return;
      const id = currentCardData.id;
      const name = currentCardData.name;
      const image = currentCardData.image;
      const prices = extractPrices(currentCardData);

      const localCard = await db.cards.get(id) || { id: id, name: name, image: image, countNormal: 0, countReverse: 0, countHolo: 0 };
      
      localCard.image = image;
      localCard.priceEur = prices.eur;
      localCard.priceUsd = prices.usd;
      localCard[variantType] = (localCard[variantType] || 0) + 1;
      
      await db.cards.put(localCard);
      checkAndDisplayCard(currentCardData);
    }

    function resetScan() {
      currentCardData = null;
      resultDiv.style.display = 'none';
      selectionGrid.style.display = 'none';
      resetBtn.style.display = 'none';
      cameraContainer.style.display = 'block';
      snapBtn.style.display = 'block';
      snapBtn.disabled = false;
      debugAi.innerText = '';
      status.innerText = 'Prêt !';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
