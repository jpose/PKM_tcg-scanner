<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Scanner PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">

  <!-- Dexie.js (Base de données locale) et Tesseract.js (OCR) -->
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #f3f4f6; color: #1f2937; text-align: center; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    .camera-box { position: relative; width: 100%; max-width: 400px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
    video { width: 100%; display: block; }
    button { margin-top: 12px; padding: 12px 24px; font-size: 1rem; font-weight: bold; color: white; background: #2563eb; border: none; border-radius: 8px; cursor: pointer; width: 100%; max-width: 400px; }
    button:disabled { background: #9ca3af; }
    #status { margin-top: 12px; font-size: 0.9rem; color: #4b5563; }
    .card-result { margin-top: 16px; padding: 16px; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; }
    .card-result img { max-width: 150px; border-radius: 8px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; font-weight: bold; margin-top: 8px; }
    .badge-owned { background: #dcfce7; color: #166534; }
    .badge-new { background: #dbeafe; color: #1e40af; }
  </style>
</head>
<body>

  <h1>Scanner de cartes TCG</h1>

  <div class="camera-box">
    <video id="video" autoplay playsinline></video>
  </div>

  <button id="snap-btn">Photographier la carte</button>
  <div id="status">Chargement de la caméra...</div>

  <div id="result" class="card-result" style="display: none;"></div>

  <script>
    // 1. Initialisation de la BDD locale Dexie
    const db = new Dexie('TCGCollection');
    db.version(1).stores({ cards: 'id, name, count' });

    const video = document.getElementById('video');
    const snapBtn = document.getElementById('snap-btn');
    const status = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    // 2. Accès à la caméra du téléphone
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; status.innerText = 'Prêt à scanner !'; })
      .catch(err => { status.innerText = 'Erreur caméra : ' + err.message; });

    // 3. Prise de photo et traitement
    snapBtn.addEventListener('click', async () => {
      snapBtn.disabled = true;
      status.innerText = 'Lecture du texte sur la carte (OCR)...';
      resultDiv.style.display = 'none';

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      try {
        // Reconnaissance OCR du texte
        const { data: { text } } = await Tesseract.recognize(canvas, 'fra+eng');
        const cleanedText = text.trim().split('\n')[0]; // On prend la 1ère ligne (nom probable)

        status.innerText = `Recherche de "${cleanedText}" sur TCGdex...`;

        // Requête sur l'API TCGdex (Pokémon FR)
        const response = await fetch(`https://api.tcgdex.net/v2/fr/cards?name=${encodeURIComponent(cleanedText)}`);
        const cards = await response.json();

        if (!cards || cards.length === 0) {
          status.innerText = 'Aucune carte trouvée. Réessayez avec un meilleur éclairage.';
          snapBtn.disabled = false;
          return;
        }

        const match = cards[0]; // Première carte correspondante
        await checkAndDisplayCard(match);

      } catch (err) {
        status.innerText = 'Erreur lors de l\'analyse : ' + err.message;
      } finally {
        snapBtn.disabled = false;
      }
    });

    // 4. Vérification dans IndexedDB et affichage
    async function checkAndDisplayCard(card) {
      const localCard = await db.cards.get(card.id);
      const isOwned = !!localCard;
      const count = isOwned ? localCard.count : 0;

      status.innerText = '';
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <img src="${card.image}/high.png" alt="${card.name}" onerror="this.src='https://via.placeholder.com/150'">
        <h3>${card.name}</h3>
        <p>ID : ${card.id}</p>
        <div class="badge ${isOwned ? 'badge-owned' : 'badge-new'}">
          ${isOwned ? `Déjà en possession (x${count})` : 'Nouvelle carte !'}
        </div>
        <br><br>
        <button onclick="addCard('${card.id}', '${card.name.replace(/'/g, "\\'")}')">
          ${isOwned ? 'Ajouter un exemplaire' : 'Ajouter à ma collection'}
        </button>
      `;
    }

    // 5. Ajout à la BDD locale
    async function addCard(id, name) {
      const localCard = await db.cards.get(id);
      const currentCount = localCard ? localCard.count : 0;
      await db.cards.put({ id: id, name: name, count: currentCount + 1 });
      alert(`Carte "${name}" mise à jour dans votre collection !`);
      location.reload();
    }

    // Enregistrement du Service Worker pour la PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
