<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Carte Pokémon TCG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .upload-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      background-color: #2563eb;
      color: white;
      text-align: center;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    .preview-container {
      position: relative;
      width: 100%;
      aspect-ratio: 2.5 / 3.5;
      background-color: #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 2px dashed #d1d5db;
    }

    .preview-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder-text {
      color: #6b7280;
      font-size: 0.9rem;
      text-align: center;
      padding: 10px;
    }

    .results {
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      display: none;
    }

    .results.active {
      display: block;
    }

    .result-item {
      margin-bottom: 12px;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #6b7280;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .result-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111827;
      margin-top: 2px;
    }

    .price-tag {
      color: #16a34a;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .loader {
      display: none;
      text-align: center;
      margin: 15px 0;
      font-weight: 600;
      color: #2563eb;
    }

    .error-msg {
      display: none;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Scanner de Carte Pokémon</h1>

  <div class="upload-section">
    <label for="file-input" class="btn">Sélectionner ou Prendre une Photo</label>
    <input type="file" id="file-input" accept="image/*" capture="environment">
  </div>

  <div class="preview-container" id="preview-box">
    <span class="placeholder-text" id="placeholder">Aucune image sélectionnée</span>
    <img id="card-img" src="" alt="Aperçu de la carte" style="display: none;">
  </div>

  <button id="scan-btn" class="btn" style="background-color: #059669;" disabled>Analyser la Carte</button>

  <div class="loader" id="loader">Analyse Gemini en cours...</div>
  <div class="error-msg" id="error-box"></div>

  <div class="results" id="results-box">
    <div class="result-item">
      <div class="result-label">Carte</div>
      <div class="result-value" id="res-name">-</div>
    </div>
    <div class="result-item">
      <div class="result-label">Extension / Numéro</div>
      <div class="result-value" id="res-set">-</div>
    </div>
    <div class="result-item">
      <div class="result-label">Côte estimée</div>
      <div class="result-value price-tag" id="res-price">0.00 €</div>
    </div>
  </div>
</div>

<script>
  const fileInput = document.getElementById('file-input');
  const scanBtn = document.getElementById('scan-btn');
  const cardImg = document.getElementById('card-img');
  const placeholder = document.getElementById('placeholder');
  const loader = document.getElementById('loader');
  const errorBox = document.getElementById('error-box');
  const resultsBox = document.getElementById('results-box');

  const resName = document.getElementById('res-name');
  const resSet = document.getElementById('res-set');
  const resPrice = document.getElementById('res-price');

  let currentBase64 = null;

  // Lecture et conversion du fichier en Base64
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      currentBase64 = event.target.result;
      
      // Affichage de la photo scannée localement
      cardImg.src = currentBase64;
      cardImg.style.display = 'block';
      placeholder.style.display = 'none';

      // Réinitialisation de l'affichage
      scanBtn.disabled = false;
      errorBox.style.display = 'none';
      resultsBox.classList.remove('active');
    };
    reader.readAsDataURL(file);
  });

  // Envoi de l'image à l'API Serverless
  scanBtn.addEventListener('click', async () => {
    if (!currentBase64) return;

    // Mise en état de chargement
    scanBtn.disabled = true;
    loader.style.display = 'block';
    errorBox.style.display = 'none';
    resultsBox.classList.remove('active');

    try {
      const response = await fetch('/api/scan', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ image: currentBase64 })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Erreur lors de l\'analyse');
      }

      // Remplacement par l'image officielle TCG si elle existe
      if (data.imageUrl) {
        cardImg.src = data.imageUrl;
      }

      // Remplissage des résultats
      resName.textContent = data.cardName;
      resSet.textContent = data.setName;
      resPrice.textContent = data.estimatedPrice ? `${data.estimatedPrice.toFixed(2)} €` : 'Indisponible';

      resultsBox.classList.add('active');

    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    } finally {
      loader.style.display = 'none';
      scanBtn.disabled = false;
    }
  });
</script>

</body>
</html>
