<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application de Scan</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --text: #0f172a;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    img.logo {
      display: block;
      max-width: 120px;
      margin: 0 auto 1rem;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: white;
      text-align: center;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 1rem;
    }
    #preview {
      width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }
    #result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 6px;
      background: #f1f5f9;
      font-size: 0.9rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.jpg" alt="Logo" class="logo">
    <h1 style="text-align: center; font-size: 1.25rem;">Scanner un document</h1>
    
    <label for="file-input" class="btn">Choisir ou prendre une photo</label>
    <input type="file" id="file-input" accept="image/*" capture="environment">

    <img id="preview" alt="Aperçu de l'image">
    <button id="scan-btn" class="btn" style="display:none; background:#059669;">Lancer le scan</button>

    <div id="result">En attente d'une image...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.error);
      });
    }

    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const scanBtn = document.getElementById('scan-btn');
    const resultDiv = document.getElementById('result');
    let base64Image = '';

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        preview.src = event.target.result;
        preview.style.display = 'block';
        scanBtn.style.display = 'block';
        base64Image = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    scanBtn.addEventListener('click', async () => {
      resultDiv.textContent = 'Analyse en cours...';
      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });
        const data = await response.json();
        resultDiv.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultDiv.textContent = 'Erreur lors de l\'envoi du scan.';
      }
    });
  </script>
</body>
</html>
